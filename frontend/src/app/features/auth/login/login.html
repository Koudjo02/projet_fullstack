<div class="login-page">
  <div class="login-wrapper">
    <a routerLink="/" class="login-brand">
      <span class="login-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="login-brand-svg">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
      </span>
      <span class="login-brand-name">TOURNOIS DE BABI</span>
    </a>

    <div class="login-card">
      <h2 class="login-title">Connexion</h2>
      <p class="login-subtitle">
        Connectez-vous pour accéder à votre espace et gérer vos tournois.
      </p>

      <button class="google-btn" (click)="loginWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuer avec Google
      </button>

      <div class="divider">
        <span>ou</span>
      </div>

      <div class="sports-box">
        <span class="sports-box-title">Sports disponibles</span>
        <div class="sports-grid">
          <div class="sport-card">
            <svg class="sport-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 7l2.5 2 2.5-1.5L16 11l-4 3-4-3 1-3.5L12 7z" />
            </svg>
            <span>Football</span>
          </div>

          <div class="sport-card">
            <svg class="sport-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
            </svg>
            <span>Basketball</span>
          </div>
        </div>
      </div>

      <p class="legal-notice">
        En vous connectant, vous acceptez nos
        <a href="#">Conditions d'utilisation</a> et notre
        <a href="#">Politique de confidentialité</a>.
      </p>
    </div>
  </div>
</div>
