<header class="sticky top-0 z-50 border-b border-border bg-background/85 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-center gap-3">
      <span class="flex h-9 w-9 items-center justify-center rounded-md bg-primary text-primary-foreground">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
      </span>
      <span class="font-display text-lg font-bold uppercase tracking-wide">
        Tournois de Babi
      </span>
    </a>

    <!-- Nav desktop : inchangée, cachée sous 768px -->
    <nav aria-label="Sports" class="hidden items-center gap-8 md:flex">
      @for (item of navItems; track item.label) {
        @if (item.disabled) {
          <span class="text-sm text-muted-foreground/50 cursor-default">
            {{ item.label }}
          </span>
        } @else {
          <a
            [href]="item.href"
            class="text-sm text-muted-foreground transition-colors hover:text-foreground"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="flex items-center gap-3">
      <a
        routerLink="/login"
        class="hidden sm:inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-colors hover:opacity-90"
      >
        Connexion
      </a>

      <!-- Bouton hamburger : visible uniquement sous 768px -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-border md:hidden"
        aria-label="Ouvrir le menu"
      >
        @if (isMobileMenuOpen()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Menu mobile déroulant, affiché seulement si ouvert ET en dessous de 768px -->
  @if (isMobileMenuOpen()) {
    <nav aria-label="Sports mobile" class="border-t border-border md:hidden">
      <div class="flex flex-col gap-1 px-4 py-4 sm:px-6">
        @for (item of navItems; track item.label) {
          @if (item.disabled) {
            <span class="rounded-md px-3 py-2 text-sm text-muted-foreground/50">
              {{ item.label }}
            </span>
          } @else {
            <a
              [href]="item.href"
              (click)="closeMobileMenu()"
              class="rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-card hover:text-foreground"
            >
              {{ item.label }}
            </a>
          }
        }
        
        <a
          routerLink="/login"
          (click)="closeMobileMenu()"
          class="mt-2 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground sm:hidden"
        >
          Connexion
        </a>
      </div>
    </nav>
  }
</header>
